{% extends 'app/layout.html' %}
{% block title %}Edit Car{% endblock %}

{% block content %}
<h2 class="mb-4">Edit Car - {{ car.name }}</h2>

<div class="row">
    <div class="col-md-6">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success mt-2">Update Car</button>
        </form>
    </div>
</div>
{% endblock %}
