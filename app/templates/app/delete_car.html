{% extends 'app/layout.html' %}
{% block title %}Delete Car{% endblock %}

{% block content %}
<h2 class="mb-4">Delete Car - {{ car.name }}</h2>

<p>Are you sure you want to delete this car? This action cannot be undone.</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'owner_dashboard' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
