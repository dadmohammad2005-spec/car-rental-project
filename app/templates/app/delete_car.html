{% extends 'app/layout.html' %}
{% block title %}Delete Vehicle - {{ car.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="glass-panel p-4 p-sm-5 text-center">
            <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-gradient text-white rounded-circle mb-4" style="width: 70px; height: 70px;">
                <i class="bi bi-exclamation-triangle fs-2"></i>
            </div>
            
            <h3 class="fw-bold mb-2 text-white">Delete Listing?</h3>
            <p class="text-secondary mb-4">Are you sure you want to delete <strong>{{ car.name }} ({{ car.model }})</strong>? This action is permanent and cannot be undone.</p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex gap-3 justify-content-center">
                    <a href="{% url 'owner_dashboard' %}" class="btn btn-outline-light px-4 py-2">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-danger px-4 py-2">
                        Yes, Delete Vehicle <i class="bi bi-trash3 ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
