{% extends 'app/layout.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100" style="background-color: #f0f0f0;">
    <div class="card shadow border-0 rounded-3" style="max-width: 400px; width: 100%; background-color: #2c2c2c;">
        
        <!-- Card Header -->
        <div class="card-header text-center text-white rounded-top-3 py-3" style="background-color: #383838;">
            <i class="bi bi-person-plus display-4 mb-1"></i>
            <h4 class="mb-0 fw-bold">Register</h4>
        </div>

        <!-- Card Body -->
        <div class="card-body p-4 text-white">
            <form method="post">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label fw-medium text-white">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                    <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
                {% endfor %}

                <button type="submit" class="btn btn-light w-100 mt-3 text-dark fw-bold">Register</button>
            </form>

            <p class="mt-3 text-center text-white small">
                Already have an account? 
                <a href="{% url 'home' %}" class="text-decoration-none fw-medium text-light">Login here</a>
            <!--ye aik button hy/ hum ne home k leay redirection dhonnda hy. pata nhi a  Ye wala issue hy. home route urls ma nahi -->
            <!-- ma bta raha hu. jb user is button b click kar to same error ayega.  -->
        </p>
        </div>
    </div>
</div>
{% endblock %}
